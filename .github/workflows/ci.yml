name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            experimental: false
          - os: ubuntu-24.04-arm
            arch: arm64
            experimental: true
          - os: macos-14
            arch: arm64
            experimental: false
          - os: windows-latest
            arch: amd64
            experimental: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: oven-sh/setup-bun@v2

      - name: Show Go environment
        run: go env GOOS GOARCH GOVERSION

      - name: Install e2e package managers
        shell: bash
        run: |
          npm install -g pnpm yarn
          python -m pip install uv poetry pdm pipx

      - name: Test Go packages
        run: go test ./... -skip '^TestE2E'

      - name: Build CLI
        shell: bash
        run: |
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          go build -o "computer-police${ext}" ./cmd/package-police

      - name: Run proxy e2e tests
        env:
          COMPUTER_POLICE_E2E_STRICT: "1"
        run: go test ./internal/proxy -run '^TestE2E' -v

  swift:
    name: Swift macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build Swift package
        working-directory: desktop/PackagePolice
        run: swift build

      - name: Test Swift package
        working-directory: desktop/PackagePolice
        run: swift test

      - name: Package macOS app
        run: VERSION=ci ./scripts/release/package_macos_app.sh
