<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Computer Police">
  <title>Computer Police</title>
  <!-- Compact-Macintosh face, matching the macOS menu-bar icon drawn by
       StatusItemController.makeMenuBarOfficerImage: cream plastic case with
       a CRT recess, a floppy slot, and a small phosphor face inside the
       screen. Same proportions as the AppKit version, redrawn for SVG. -->
  <!-- Plastic case -->
  <rect x="3" y="3" width="26" height="26" rx="2.5" ry="2.5"
        fill="#e8dcb8" stroke="#22180a" stroke-width="1.5" />
  <!-- CRT screen recess -->
  <rect x="6.5" y="6.5" width="19" height="11"
        fill="#0a0c14" stroke="#22180a" stroke-width="0.75" />
  <!-- Floppy slot -->
  <rect x="8" y="22" width="16" height="1.6" fill="#22180a" />
  <!-- Eyes (phosphor green) -->
  <circle cx="12" cy="12" r="1.3" fill="#5be38a" />
  <circle cx="20" cy="12" r="1.3" fill="#5be38a" />
  <!-- Smile -->
  <rect x="13.5" y="14.4" width="5" height="1.2" fill="#5be38a" />
</svg>
