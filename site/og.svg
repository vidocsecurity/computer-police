<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- CRT vignette: deep navy with a faint phosphor glow from center -->
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f1525" />
      <stop offset="60%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <!-- Scanline pattern: 2px rows of subtle horizontal stripes -->
    <pattern id="scanlines" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#5be38a" fill-opacity="0.035" />
    </pattern>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0%"   stop-color="#5be38a" stop-opacity="0" />
      <stop offset="50%"  stop-color="#5be38a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#5be38a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background + scanlines -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#scanlines)" />

  <!-- Header: compact Mac icon + wordmark -->
  <g transform="translate(80, 70)">
    <g transform="scale(1.7)">
      <rect x="3" y="3" width="26" height="26" rx="2.5" ry="2.5"
            fill="#e8dcb8" stroke="#22180a" stroke-width="1.5" />
      <rect x="6.5" y="6.5" width="19" height="11"
            fill="#0a0c14" stroke="#22180a" stroke-width="0.75" />
      <rect x="8" y="22" width="16" height="1.6" fill="#22180a" />
      <circle cx="12" cy="12" r="1.3" fill="#5be38a" />
      <circle cx="20" cy="12" r="1.3" fill="#5be38a" />
      <rect x="13.5" y="14.4" width="5" height="1.2" fill="#5be38a" />
    </g>

    <text
      x="80" y="38"
      font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
      font-size="22" font-weight="700" letter-spacing="6"
      fill="#d8deef">COMPUTER POLICE</text>
  </g>

  <!-- Eyebrow -->
  <text
    x="80" y="270"
    font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
    font-size="20" font-weight="500" letter-spacing="6"
    fill="#5be38a">A LOCAL SUPPLY-CHAIN FIREWALL</text>

  <!-- Headline -->
  <text
    x="80" y="350"
    font-family="Inter, -apple-system, system-ui, sans-serif"
    font-size="78" font-weight="700" letter-spacing="-2"
    fill="#ffffff">Stop agents from</text>
  <text
    x="80" y="430"
    font-family="Inter, -apple-system, system-ui, sans-serif"
    font-size="78" font-weight="700" letter-spacing="-2"
    fill="#ffffff">installing malware.</text>

  <!-- Subline -->
  <text
    x="80" y="490"
    font-family="Inter, -apple-system, system-ui, sans-serif"
    font-size="26" font-weight="400"
    fill="#8993b3">Blocks confirmed-malicious npm and pip installs before they touch your disk.</text>

  <!-- Divider rule -->
  <rect x="80" y="540" width="1040" height="1" fill="url(#rule)" />

  <!-- Footer row: install command + by Vidoc -->
  <text
    x="80" y="582"
    font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
    font-size="20" fill="#5be38a">$ curl -fsSL computer.police.dev/install | bash</text>

  <text
    x="1120" y="582" text-anchor="end"
    font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
    font-size="18" fill="#5d6788">by Vidoc Security</text>
</svg>
